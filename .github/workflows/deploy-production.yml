name: Deploy Production

on:
  # Release/hotfix PR gating is temporarily disabled. Every push to main
  # deploys after the test job passes.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roundzero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Run test database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roundzero_test?sslmode=disable

      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roundzero_test?sslmode=disable
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roundzero_test?sslmode=disable

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Create secrets file
        run: |
          cat > .env.ci <<EOF
          NODE_ENV=${{ secrets.NODE_ENV }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          APP_URL=${{ secrets.APP_URL }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_TOKEN=${{ secrets.AI_GATEWAY_TOKEN }}
          POLAR_ACCESS_TOKEN=${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_MODE=${{ secrets.POLAR_MODE }}
          POLAR_WEBHOOK_SECRET=${{ secrets.POLAR_WEBHOOK_SECRET }}
          POLAR_PRODUCT_ID_STARTER=${{ secrets.POLAR_PRODUCT_ID_STARTER }}
          POLAR_PRODUCT_ID_GROWTH=${{ secrets.POLAR_PRODUCT_ID_GROWTH }}
          POLAR_PRODUCT_ID_SCALE=${{ secrets.POLAR_PRODUCT_ID_SCALE }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID=${{ secrets.ELEVENLABS_AGENT_ID }}
          ELEVENLABS_WEBHOOK_SECRET=${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}
          PLATFORM_ADMIN_EMAILS=${{ secrets.PLATFORM_ADMIN_EMAILS }}
          EOF

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build and deploy
        # @cloudflare/vite-plugin resolves the environment at BUILD time via
        # CLOUDFLARE_ENV and writes a flattened dist config. `wrangler deploy`
        # must NOT pass --env (it would double-suffix / fail to match).
        run: bun run build && bunx wrangler deploy --secrets-file .env.ci
        env:
          CLOUDFLARE_ENV: production
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_PUBLIC_ASSET_BASE_URL: ${{ secrets.VITE_PUBLIC_ASSET_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
