name: Deploy

on:
  push:
    branches: [staging]

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Create secrets file
        run: |
          cat > .env.ci <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          APP_URL=${{ secrets.APP_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_TOKEN=${{ secrets.AI_GATEWAY_TOKEN }}
          POLAR_ACCESS_TOKEN=${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET=${{ secrets.POLAR_WEBHOOK_SECRET }}
          POLAR_PRODUCT_ID_PRO=${{ secrets.POLAR_PRODUCT_ID_PRO }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID=${{ secrets.ELEVENLABS_AGENT_ID }}
          ELEVENLABS_WEBHOOK_SECRET=${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}
          EOF

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build and deploy
        run: vite build && wrangler deploy --env ${{ github.ref_name == 'main' && 'production' || 'staging' }} --secrets-file .env.ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
